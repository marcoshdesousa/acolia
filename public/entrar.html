<!doctype html>
<html lang="pt-BR">
<head>
  <title>Entrar — Acolia</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f5550">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar"><div class="container">
    <a class="brand" href="/"><span data-logo><img class="brand-mark" src="/img/logo-simbolo.png" alt="" width="34" height="34"></span><img class="brand-word" src="/img/logo-nome.png" alt="Acolia"></a>
  </div></header>
  <main class="narrow" style="padding-top:32px;padding-bottom:48px">
    <h1 class="center">Entrar</h1>
    <div class="tabs" role="tablist" style="margin-bottom:20px">
      <button role="tab" data-tab="paciente" class="active">Sou paciente</button>
      <button role="tab" data-tab="profissional">Sou profissional</button>
    </div>

    <section data-panel="paciente" class="card">
      <form data-login-patient>
        <div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" required></div>
        <div class="field"><label for="pw1">Senha</label><input id="pw1" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn block" type="submit">Entrar</button>
      </form>
      <p class="center small" style="margin:16px 0 0"><a href="#" data-recover>Esqueci minha senha</a> · <a href="/cadastro-paciente">Criar conta</a></p>
    </section>

    <section data-panel="profissional" class="card hidden">
      <form data-login-pro>
        <div class="field"><label for="login">Seu código de profissional ou e-mail</label><input id="login" name="login" autocomplete="username" placeholder="Ex.: K7M2QX9A" required></div>
        <div class="field"><label for="pw2">Senha</label><input id="pw2" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn block" type="submit">Entrar no painel</button>
      </form>
      <p class="center small muted" style="margin:16px 0 0">Perdeu seu código ou senha? Fale com a administração da Acolia.<br><a href="/cadastro-profissional">Cadastrar-me como profissional</a></p>
    </section>

    <div class="card flat get-app" data-install-card style="margin-top:16px">
      <img src="/img/app-icon-192.png" alt="">
      <div class="grow"><b>Baixe o app da Acolia</b><div class="small muted">Grátis, pelo próprio site. Receba as mensagens como notificação.</div></div>
      <button class="btn secondary sm" type="button" data-install>Como baixar</button>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script>
  (function () {
    const { $, $$, api, ICONS, handleForm, maskCpf, modal, esc, copyText, toast } = Acolia;
    $('[data-logo]').innerHTML = ICONS.logo;
    const show = (t) => {
      $$('[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === t));
      $$('[data-panel]').forEach((p) => p.classList.toggle('hidden', p.dataset.panel !== t));
    };
    $$('[data-tab]').forEach((b) => b.addEventListener('click', () => { show(b.dataset.tab); history.replaceState(null, '', '#' + b.dataset.tab); }));
    if (location.hash === '#profissional') show('profissional');
    maskCpf($('#cpf'));
    // Já entrou? Volta para a página inicial (lá tem o botão para abrir o app/sistema)
    api('/api/auth/me').then((m) => { if (m && m.role && !new URLSearchParams(location.search).get('next')) location.replace('/'); }).catch(() => {});
    const next = new URLSearchParams(location.search).get('next');
    const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;
    if (safeNext) $('a[href="/cadastro-paciente"]').href = '/cadastro-paciente?next=' + encodeURIComponent(safeNext);
    handleForm($('[data-login-patient]'), async (d) => {
      await api('/api/auth/patient/login', { method: 'POST', body: d });
      location.replace(safeNext || '/');
    });
    handleForm($('[data-login-pro]'), async (d, f) => {
      try {
        await api('/api/auth/professional/login', { method: 'POST', body: d });
      } catch (e) {
        // Cadastro em análise: mostra o aviso com o botão do WhatsApp de atendimento
        if (e.data?.pending) {
          let box = $('[data-pending-login]', f);
          if (!box) { box = document.createElement('div'); box.dataset.pendingLogin = ''; box.style.marginTop = '14px'; f.appendChild(box); }
          box.innerHTML = Acolia.pendingProBox(e.data);
          return;
        }
        throw e;
      }
      location.replace(safeNext || '/');
    });
    $('[data-recover]').addEventListener('click', async (e) => {
      e.preventDefault();
      const r = await modal({
        title: 'Recuperar senha',
        html: '<p class="muted">Informe seus dados exatamente como no cadastro. Se conferirem, você cria uma senha nova na hora.</p>'
          + '<div class="form-error hidden" data-err></div>'
          + '<div class="field"><label for="rname">Nome completo</label><input id="rname" autocomplete="name"></div>'
          + '<div class="field"><label for="rcpf">CPF</label><input id="rcpf" inputmode="numeric"></div>'
          + '<div class="field"><label for="rbirth">Data de nascimento</label><input id="rbirth" type="date"></div>'
          + '<div class="field"><label for="rpw">Nova senha</label><input id="rpw" type="password" autocomplete="new-password" minlength="6"><div class="hint">Mínimo de 6 caracteres.</div></div>'
          + '<div class="field"><label for="rpw2">Repita a nova senha</label><input id="rpw2" type="password" autocomplete="new-password"></div>',
        onOpen: (dlg) => maskCpf($('#rcpf', dlg)),
        actions: [{ label: 'Cancelar', value: null, class: 'secondary' }, {
          label: 'Salvar nova senha', handler: async (dlg) => {
            const err = $('[data-err]', dlg);
            const fail = (m) => { err.textContent = m; err.classList.remove('hidden'); return false; };
            if (!$('#rbirth', dlg).value) return fail('Informe sua data de nascimento.');
            if ($('#rpw', dlg).value !== $('#rpw2', dlg).value) return fail('As senhas não são iguais.');
            try {
              await api('/api/auth/patient/recover', { method: 'POST', body: { cpf: $('#rcpf', dlg).value, name: $('#rname', dlg).value, birth_date: $('#rbirth', dlg).value, password: $('#rpw', dlg).value } });
              $('#cpf').value = $('#rcpf', dlg).value;
              return true;
            } catch (ex) { return fail(ex.message); }
          },
        }],
      });
      if (!r) return;
      toast('Senha alterada! Agora é só entrar com seu CPF e a nova senha.');
      $('#pw1')?.focus();
    });
  })();
  </script>
</body>
</html>

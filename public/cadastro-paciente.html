<!doctype html>
<html lang="pt-BR">
<head>
  <title>Criar conta — Acolia</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f5550">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar"><div class="container">
    <a class="brand" href="/"><span data-logo></span><img class="brand-word" src="/img/logo-nome.png" alt="Acolia"></a>
  </div></header>
  <main class="narrow" style="padding-top:32px;padding-bottom:48px">
    <h1 class="center">Criar sua conta</h1>
    <p class="center muted">Com a conta você vê valores e localização dos profissionais, conversa pelo chat e faz sua consulta.</p>
    <form class="card" data-form novalidate>
      <div class="field"><label for="name">Nome completo</label><input id="name" name="name" autocomplete="name" required maxlength="120">
        <div class="hint">Igual ao que consta no seu CPF.</div></div>
      <div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required>
        <div class="hint" data-cpf-hint>Precisa ser um CPF válido. Você vai usá-lo para entrar.</div></div>
      <div class="field"><label>Onde você mora</label>
        <div class="grid-uf"><select name="state" aria-label="Estado" required></select><input name="city" placeholder="Município" aria-label="Município" required></div></div>
      <div class="field"><label for="pw">Crie uma senha</label><input id="pw" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <div class="hint">Mínimo de 6 caracteres.</div></div>
      <div class="field"><label for="pw2">Repita a senha</label><input id="pw2" name="password2" type="password" autocomplete="new-password" required></div>
      <label class="check small" style="font-weight:400;margin-bottom:16px"><input type="checkbox" name="terms" required> Concordo com o uso dos meus dados para o funcionamento da plataforma, conforme a LGPD.</label>
      <button class="btn block" type="submit">Criar conta</button>
      <p class="center small" style="margin:16px 0 0">Já tem conta? <a href="/entrar">Entrar</a></p>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script>
  (function () {
    const { $, api, ICONS, handleForm, maskCpf, isValidCpf, ufOptions, bindUfCity } = Acolia;
    $('[data-logo]').innerHTML = ICONS.logo;
    const form = $('[data-form]');
    form.state.innerHTML = ufOptions('', 'UF');
    bindUfCity(form.state, form.city);
    maskCpf(form.cpf);
    form.cpf.addEventListener('blur', () => {
      const bad = form.cpf.value && !isValidCpf(form.cpf.value);
      $('[data-cpf-hint]').textContent = bad ? 'CPF inválido — confira os números.' : 'Precisa ser um CPF válido. Você vai usá-lo para entrar.';
      $('[data-cpf-hint]').style.color = bad ? 'var(--danger)' : '';
    });
    handleForm(form, async (d) => {
      if (!isValidCpf(d.cpf)) throw new Error('CPF inválido. Confira os números digitados.');
      if (d.password !== d.password2) throw new Error('As senhas não são iguais.');
      if (!d.terms) throw new Error('Para continuar, aceite o uso dos dados.');
      await api('/api/auth/patient/register', { method: 'POST', body: d });
      location.href = '/app';
    });
  })();
  </script>
</body>
</html>

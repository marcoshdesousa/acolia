<!doctype html>
<html lang="pt-BR">
<head>
  <title>Publicação — Acolia</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f5550">
  <meta name="description" content="Veja esta publicação na Acolia — saúde mental ao seu alcance.">
  <meta property="og:title" content="Publicação na Acolia">
  <meta property="og:description" content="Crie sua conta grátis para ver esta publicação.">
  <meta property="og:image" content="/img/app-icon-512.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar"><div class="container">
    <a class="brand" href="/"><span data-logo><img class="brand-mark" src="/img/logo-simbolo.png" alt="" width="34" height="34"></span><img class="brand-word" src="/img/logo-nome.png" alt="Acolia"></a>
    <nav data-nav></nav>
  </div></header>
  <main class="container" style="padding-top:20px;padding-bottom:48px;max-width:600px">
    <div data-post><div class="spinner"></div></div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/social.js"></script>
  <script>
  // Publicação compartilhada pelo aviãozinho: qualquer pessoa vê; curtir e comentar pedem conta
  (async function () {
    const { $, api, ICONS, esc } = Acolia;
    $('[data-logo]').innerHTML = ICONS.logo;
    const id = Number(location.pathname.split('/').pop());
    const here = location.pathname;
    const me = await api('/api/auth/me').catch(() => ({}));
    const box = $('[data-post]');
    const logged = ['patient', 'professional'].includes(me.role);
    const needAccount = () => Acolia.modal({
      title: 'Crie sua conta grátis',
      html: '<p>Para curtir, comentar, seguir e marcar sua consulta, crie sua conta grátis. Depois você volta direto para esta publicação.</p>',
      actions: [{ label: 'Já tenho conta', value: 'entrar', class: 'secondary' }, { label: 'Criar conta', value: 'criar' }],
    }).then((v) => {
      if (v === 'criar') location.href = '/cadastro-paciente?next=' + encodeURIComponent(here);
      if (v === 'entrar') location.href = '/entrar?next=' + encodeURIComponent(here);
    });
    const app = me.role === 'patient' ? '/app' : '/painel';
    if (logged) $('[data-nav]').innerHTML = `<a class="btn secondary sm" href="${app}">${me.role === 'patient' ? 'Abrir meu app' : 'Meu painel'}</a>`;
    else $('[data-nav]').innerHTML = '<a class="btn secondary sm" href="/entrar?next=' + encodeURIComponent(here) + '">Entrar</a>';
    try {
      const p = await api(`/api/social/posts/${id}`);
      AcoliaSocial.setContext({
        role: me.role, me: me.user, anon: !logged, onNeedAccount: needAccount,
        // Sem conta, o perfil abre na versão com as informações bloqueadas
        onOpenProfile: (pid) => {
          if (me.role === 'patient') location.href = `/app#perfil/${pid}`;
          else if (me.role === 'professional') location.href = `/painel#verpro/${pid}`;
          else location.href = p.author.slug ? `/${p.author.slug}` : `/profissional.html?id=${pid}`;
        },
      });
      box.innerHTML = AcoliaSocial.postCard(p) + (logged
        ? `<p class="center" style="margin-top:16px"><a class="btn secondary" href="${app}">Ir para o Início</a></p>`
        : `<div class="card stack center" style="margin-top:16px;padding:20px">
            <b style="display:block;font-size:1.05rem">Gostou? Crie sua conta grátis na Acolia</b>
            <span class="muted small" style="display:block">Com a conta você curte, comenta, segue profissionais e marca sua consulta.</span>
            <div class="row" style="justify-content:center"><a class="btn" href="/cadastro-paciente?next=${encodeURIComponent(here)}">Criar conta grátis</a>
              <a class="btn secondary" href="/entrar?next=${encodeURIComponent(here)}">Já tenho conta</a></div></div>`);
      AcoliaSocial.bindActions(box);
    } catch (e) {
      box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  })();
  </script>
</body>
</html>

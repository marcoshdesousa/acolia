<!doctype html>
<html lang="pt-BR">
<head>
  <title>Publicação — Acolia</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f5550">
  <meta name="description" content="Veja esta publicação na Acolia — saúde mental ao seu alcance.">
  <meta property="og:title" content="Publicação na Acolia">
  <meta property="og:description" content="Crie sua conta grátis para ver esta publicação.">
  <meta property="og:image" content="/img/app-icon-512.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar"><div class="container">
    <a class="brand" href="/"><span data-logo></span><img class="brand-word" src="/img/logo-nome.png" alt="Acolia"></a>
    <nav data-nav></nav>
  </div></header>
  <main class="container" style="padding-top:20px;padding-bottom:48px;max-width:600px">
    <div data-post><div class="spinner"></div></div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/social.js"></script>
  <script>
  // Publicação compartilhada pelo aviãozinho: só abre para quem tem conta
  (async function () {
    const { $, api, ICONS, esc } = Acolia;
    $('[data-logo]').innerHTML = ICONS.logo;
    const id = Number(location.pathname.split('/').pop());
    const here = location.pathname;
    const me = await api('/api/auth/me').catch(() => ({}));
    const box = $('[data-post]');
    if (!['patient', 'professional'].includes(me.role)) {
      $('[data-nav]').innerHTML = '<a class="btn secondary sm" href="/entrar?next=' + encodeURIComponent(here) + '">Entrar</a>';
      box.innerHTML = `<div class="card stack center" style="padding:28px">
        <img src="/img/logo-simbolo.png" alt="" width="64" height="64" style="margin:0 auto">
        <h1 style="font-size:1.4rem">Alguém compartilhou uma publicação com você</h1>
        <p class="muted">Para ver esta publicação, crie sua conta grátis ou entre. Depois você volta direto para ela.</p>
        <div class="row" style="justify-content:center"><a class="btn" href="/cadastro-paciente?next=${encodeURIComponent(here)}">Criar conta grátis</a>
          <a class="btn secondary" href="/entrar?next=${encodeURIComponent(here)}">Já tenho conta</a></div></div>`;
      return;
    }
    const app = me.role === 'patient' ? '/app' : '/painel';
    $('[data-nav]').innerHTML = `<a class="btn secondary sm" href="${app}">${me.role === 'patient' ? 'Abrir meu app' : 'Meu painel'}</a>`;
    AcoliaSocial.setContext({
      role: me.role, me: me.user,
      onOpenProfile: (pid) => { location.href = me.role === 'patient' ? `/app#perfil/${pid}` : `/painel#verpro/${pid}`; },
    });
    try {
      const p = await api(`/api/social/posts/${id}`);
      box.innerHTML = AcoliaSocial.postCard(p) + `<p class="center" style="margin-top:16px"><a class="btn secondary" href="${app}">Ir para o Início</a></p>`;
      AcoliaSocial.bindActions(box);
    } catch (e) {
      box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <title>Só um instante — Acolia</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f5550">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <!-- Aparece no lugar da tela de erro do servidor (atualização do site ou servidor reiniciando).
       Tudo aqui dentro (sem depender de outros arquivos) e volta sozinha para a página quando o site responder. -->
  <style>
    :root { --bg: #faf9f5; --ink: #26322f; --muted: #5d6b66; --deep: #2e403c; --sage: #9db8b0; --mist: #e5ebe8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 20px; }
    .breath { position: relative; width: 168px; height: 168px; display: grid; place-items: center; margin-bottom: 28px; }
    .breath::before, .breath::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--mist); animation: breathe 6s ease-in-out infinite; }
    .breath::after { inset: 22px; background: #cfe0d6; animation-delay: .4s; }
    .breath img { position: relative; z-index: 1; width: 78px; height: 78px; }
    @keyframes breathe { 0%, 100% { transform: scale(.82); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }
    h1 { font-size: 1.5rem; margin: 0 0 10px; color: var(--deep); font-weight: 800; }
    p { margin: 0 auto 8px; max-width: 360px; color: var(--muted); line-height: 1.5; }
    .hint { font-size: .9rem; margin-top: 4px; }
    .dots span { display: inline-block; width: 8px; height: 8px; margin: 18px 4px 0; border-radius: 50%; background: var(--sage); animation: dot 1.4s ease-in-out infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
    button { margin-top: 24px; border: 0; border-radius: 999px; padding: 12px 26px; font: inherit; font-weight: 800; color: #fff; background: var(--deep); cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { .breath::before, .breath::after, .dots span { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="breath" aria-hidden="true"><img src="/img/logo-simbolo.png" alt=""></div>
    <h1>Estamos preparando tudo para você</h1>
    <p>A Acolia está passando por uma atualização rápida. Respire fundo: em instantes tudo volta ao normal.</p>
    <p class="hint">Esta página volta sozinha assim que estiver pronta.</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <button type="button" id="again">Tentar agora</button>
  </main>
  <script>
    // Confere de tempos em tempos se o site voltou; quando voltar, abre a página que a pessoa queria
    (function () {
      var busy = false;
      function check() {
        if (busy) return;
        busy = true;
        fetch('/api/config', { cache: 'no-store' }).then(function (r) {
          busy = false;
          var routing = r.headers.get('x-render-routing') || '';
          if (r.ok && !/^(no-server|suspend)/.test(routing)) location.reload();
        }).catch(function () { busy = false; });
      }
      setInterval(check, 5000);
      document.getElementById('again').addEventListener('click', check);
    })();
  </script>
</body>
</html>

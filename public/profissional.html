<!doctype html>
<html lang="pt-BR">
<head>
  <title>Profissional — Acolia</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f5550">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar"><div class="container">
    <a class="brand" href="/"><span data-logo></span><img class="brand-word" src="/img/logo-nome.png" alt="Acolia"></a>
    <nav><a class="btn secondary sm" href="/entrar">Entrar</a></nav>
  </div></header>
  <main class="container" style="padding-top:20px;padding-bottom:48px">
    <a href="/#vitrine" class="btn ghost sm" style="margin-bottom:12px">← Voltar para a vitrine</a>
    <div data-profile><div class="spinner"></div></div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/profile-view.js"></script>
  <script>
  (async function () {
    const { $, api, ICONS, esc } = Acolia;
    $('[data-logo]').innerHTML = ICONS.logo;
    const id = Number(new URLSearchParams(location.search).get('id'));
    const me = await api('/api/auth/me').catch(() => ({}));
    if (me.role === 'patient') { location.replace('/app#perfil/' + id); return; }
    try {
      const p = await api('/api/professionals/' + id);
      document.title = p.name + ' — Acolia';
      $('[data-profile]').innerHTML = AcoliaProfile.render(p, {
        actions: '<a class="btn" href="/entrar?next=' + encodeURIComponent('/app#conversar/' + id) + '">' + ICONS.chat.replace('<svg', '<svg style="width:18px;height:18px"') + ' Enviar mensagem</a>',
      });
    } catch (e) {
      $('[data-profile]').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    }
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <title>Profissional — Acolia</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f5550">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar"><div class="container">
    <a class="brand" href="/"><span data-logo><img class="brand-mark" src="/img/logo-simbolo.png" alt="" width="34" height="34"></span><img class="brand-word" src="/img/logo-nome.png" alt="Acolia"></a>
    <nav data-nav></nav>
  </div></header>
  <main class="container" style="padding-top:20px;padding-bottom:48px">
    <a href="/#vitrine" class="btn ghost sm" style="margin-bottom:12px">← Voltar para a vitrine</a>
    <div data-profile><div class="spinner"></div></div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/specialties.js"></script>
  <script src="/js/profile-view.js"></script>
  <script src="/js/social.js"></script>
  <script>
  (async function () {
    const { $, api, ICONS, esc, modal, toast } = Acolia;
    $('[data-logo]').innerHTML = ICONS.logo;
    // Abre pelo link próprio (site.com/nome) ou pelo antigo ?id=
    const key = document.body.dataset.slug || new URLSearchParams(location.search).get('id');
    const here = location.pathname + location.search;
    const me = await api('/api/auth/me').catch(() => ({}));
    const patient = me.role === 'patient';
    const nav = $('[data-nav]');
    const pro = me.role === 'professional';
    if (patient) nav.innerHTML = '<a class="btn secondary sm" href="/app">Abrir meu app</a>';
    else if (pro) nav.innerHTML = '<a class="btn secondary sm" href="/painel">Meu painel</a>';
    else nav.innerHTML = '<a class="btn secondary sm" href="/entrar?next=' + encodeURIComponent(here) + '">Entrar</a>';

    function needAccount() {
      modal({
        title: 'Crie sua conta grátis',
        html: '<p>Para seguir, mandar mensagem e ver os valores, o endereço, o "Sobre" e todas as fotos, crie sua conta grátis. Depois você volta direto para este perfil.</p>',
        actions: [{ label: 'Já tenho conta', value: 'entrar', class: 'secondary' }, { label: 'Criar conta', value: 'criar' }],
      }).then((v) => {
        if (v === 'criar') location.href = '/cadastro-paciente?next=' + encodeURIComponent(here);
        if (v === 'entrar') location.href = '/entrar?next=' + encodeURIComponent(here);
      });
    }

    try {
      const p = await api('/api/professionals/' + encodeURIComponent(key));
      document.title = p.official ? p.name + ' | Acolia' : p.name + ' — ' + p.profession + ' | Acolia';
      const chat = ICONS.chat.replace('<svg', '<svg style="width:18px;height:18px"');
      $('[data-profile]').innerHTML = AcoliaProfile.render(p, {
        next: here,
        // Profissional vendo outro profissional: só segue (não manda mensagem)
        actions: pro ? '' : '<button class="btn" data-msg>' + chat + ' Enviar mensagem</button>',
      });
      AcoliaSocial.setContext({ role: me.role, me: me.user, onOpenProfile: (id) => { location.href = '/profissional.html?id=' + id; }, onMessage: (id) => { location.href = '/app#conversar/' + id; } });
      AcoliaSocial.bindProfile($('[data-profile]'), p, { onNeedAccount: needAccount });
      if (pro || p.official) return;
      $('[data-msg]').addEventListener('click', () => {
        if (!patient) return needAccount();
        location.href = '/app#conversar/' + p.id;
      });
    } catch (e) {
      $('[data-profile]').innerHTML = '<div class="empty">' + esc(e.message === 'Profissional não encontrado.' ? 'Este profissional não está disponível no momento.' : e.message) + '</div>';
    }
  })();
  </script>
</body>
</html>

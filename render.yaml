# Publicação com um clique no Render (render.com) — plano GRÁTIS.
# Atenção: no plano grátis não há disco permanente. Os cadastros, mensagens
# e fotos são apagados quando o site "dorme" (15 min sem visitas) ou é
# atualizado. Serve para ver e testar. Para uso real, troque "plan: free"
# por "plan: starter" e descomente o bloco "disk" no final.
services:
  - type: web
    name: acolia
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false # o Render pede para você digitar a senha do admin
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
    # Uso real (plano pago): descomente as linhas abaixo
    #   - key: DATA_DIR
    #     value: /var/data
    # disk:
    #   name: dados
    #   mountPath: /var/data
    #   sizeGB: 1
